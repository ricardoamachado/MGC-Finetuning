[project]
name = "mgc-finetuning"
version = "0.1.0"
description = "Fine-tuning de transformers de áudio (AST e BAT) para classificação de gêneros musicais."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.10.1",
    "huggingface-hub>=1.33.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.11.2",
    "peft>=0.21.2",
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.16.0",
    "transformers>=4.57.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgc_finetuning"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
